  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:11px;letter-spacing:.28em;color:#173d36;background:transparent;border:1px solid rgba(23,61,54,.45);padding:9px 16px;cursor:pointer\" style-hover=\"background:rgba(23,61,54,.1)\">SKIP<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ toggleSound }}\" style=\"font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.28em;color:#173d36;background:transparent;border:1px solid rgba(23,61,54,.45);padding:9px 16px;cursor:pointer\" style-hover=\"background:rgba(23,61,54,.1)\">{{ soundLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"animation:rm-fadein .6s ease both\">\n\n  <!-- HERO -->\n  <section style=\"min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(60px,10vh,90px) 20px 60px;background:#00D6B4;position:relative;overflow:hidden\">\n    <div style=\"font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.4em;color:#0b3d33;margin-bottom:18px\">EST. 6,666 MACHINES<\u002Fdiv>\n    <h1 style=\"font-family:'Special Elite',Courier,monospace;font-size:clamp(38px,9vw,96px);line-height:1.02;letter-spacing:.02em;color:#16233b;margin:0 0 22px;max-width:16ch\">ROYAL<br>MECHANICA<\u002Fh1>\n    <p style=\"font-family:Archivo,sans-serif;font-size:clamp(15px,2vw,19px);color:#0b3d33;max-width:52ch;margin:0 0 40px;line-height:1.55\">A collection of 6,666 mechanical machines, each struck with its own stock-market ticker. Register for the whitelist below.<\u002Fp>\n    <a href=\"/whitelist\" sc-camel-on-click=\"{{ click }}\" style=\"font-family:'Special Elite',monospace;font-size:clamp(16px,2vw,20px);letter-spacing:.12em;color:#16233b;background:#C6FF1E;border:none;padding:20px 46px;cursor:pointer;box-shadow:0 6px 0 #8fbf12,0 10px 18px rgba(0,0,0,.2);display:inline-block\" style-hover=\"background:#d4ff4a\">JOIN WHITELIST<\u002Fa>\n    <div style=\"margin-top:56px;display:flex;gap:28px;flex-wrap:wrap;justify-content:center;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.2em;color:#0b3d33\">\n      <span>SUPPLY 6,666<\u002Fspan><span>·<\u002Fspan><span>WHITELIST OPEN<\u002Fspan><span>·<\u002Fspan><a href=\"{{ xProfileUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"color:#16233b\" style-hover=\"color:#0b3d33\">{{ xHandle }}<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- GALLERY -->\n  <section style=\"padding:clamp(60px,8vw,100px) 20px;background:#F2E7D2\">\n    <div style=\"max-width:1160px;margin:0 auto\">\n      <div style=\"text-align:center;margin-bottom:52px\">\n        <div style=\"font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.35em;color:#9A3D05;margin-bottom:12px\">THE ARCHIVE<\u002Fdiv>\n        <h2 style=\"font-family:'Special Elite',monospace;font-size:clamp(26px,4vw,42px);margin:0;color:#1A1614\">GALLERY<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px\">\n        <sc-for list=\"{{ galleryItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n          <div style=\"background:#EFE3C8;border:1px solid #d9c9a6;padding:16px 16px 20px;box-shadow:0 8px 16px rgba(0,0,0,.10);transition:transform .18s ease,box-shadow .18s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 14px 24px rgba(0,0,0,.16)\">\n            <div style=\"aspect-ratio:1;background:{{ item.ground }};display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px\">\n              <div role=\"img\" aria-label=\"{{ item.ticker }} machine\" style=\"width:100%;height:100%;background-image:{{ item.imageCss }};background-size:contain;background-repeat:no-repeat;background-position:center\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.12em;color:#7a6a4e;margin-bottom:6px\">\n              <span>NO. {{ item.id }}<\u002Fspan><span>{{ item.rarity }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:'Special Elite',monospace;font-size:22px;color:#1A1614\">{{ item.ticker }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"text-align:center;margin-top:34px;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.1em;color:#9A3D05\">5 of 6,666 machines shown — full archive revealed at mint.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ROADMAP / VISION -->\n  <section style=\"padding:clamp(60px,8vw,100px) 20px;background:#23395B;color:#F2E7D2\">\n    <div style=\"max-width:900px;margin:0 auto\">\n      <div style=\"text-align:center;margin-bottom:52px\">\n        <div style=\"font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.35em;color:#9db3d6;margin-bottom:12px\">THE LEDGER<\u002Fdiv>\n        <h2 style=\"font-family:'Special Elite',monospace;font-size:clamp(26px,4vw,42px);margin:0;color:#F2E7D2;min-height:1.2em\"><span style=\"display:inline-block;animation:rm-reveal .95s steps(7) both\">ROADMAP<\u002Fspan><span style=\"display:inline-block;width:.06em;height:.9em;vertical-align:-.08em;background:#F2E7D2;animation:rm-caret .9s steps(1) infinite;margin-left:3px\"><\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:0\">\n        <sc-for list=\"{{ roadmapItems }}\" as=\"phase\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:64px 1fr;gap:20px;padding:22px 0;border-top:1px solid rgba(242,231,210,.18)\">\n            <div style=\"font-family:'Special Elite',monospace;font-size:22px;color:#C6FF1E\">{{ phase.phase }}<\u002Fdiv>\n            <div>\n              <div style=\"display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px\">\n                <span style=\"font-family:'Special Elite',monospace;font-size:19px\">{{ phase.title }}<\u002Fspan>\n                <span style=\"font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:.18em;color:#9db3d6;border:1px solid rgba(157,179,214,.4);padding:3px 8px\">{{ phase.status }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;color:#d9e1ee;max-width:60ch\">{{ phase.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TOKEN CONCEPT -->\n  <section style=\"padding:clamp(60px,8vw,100px) 20px;background:#FFD400\">\n    <div style=\"max-width:900px;margin:0 auto;text-align:center\">\n      <div style=\"font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.35em;color:#16233b;margin-bottom:12px\">MORE THAN A PICTURE<\u002Fdiv>\n      <h2 style=\"font-family:'Special Elite',monospace;font-size:clamp(24px,3.6vw,38px);margin:0 0 22px;color:#16233b\">EACH MACHINE HAS A TICKER<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#2a2410;max-width:62ch;margin:0 auto 20px\">Every Royal Mechanica NFT is struck with its own stock-market-style ticker identity, in the tradition of the machines shown in our references — tickers like $NVDA, $MSFT, $GOOGL, $AAPL and $AMZN.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.7;color:#2a2410;max-width:62ch;margin:0 auto 20px\">In a future phase, holders will be able to verify their machine and connect its ticker identity to a token reward system. This system is not live today. Mechanics, timing and eligibility will be announced on our official X account before anything goes live.<\u002Fp>\n      <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px\">\n        <sc-for list=\"{{ tickerChips }}\" as=\"tk\" hint-placeholder-count=\"6\">\n          <span style=\"font-family:'Special Elite',monospace;font-size:14px;background:#16233b;color:#C6FF1E;padding:8px 16px;border-radius:2px\">{{ tk.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SOCIAL -->\n  <section style=\"padding:clamp(60px,8vw,90px) 20px;background:#F2E7D2;text-align:center\">\n    <div style=\"font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.35em;color:#9A3D05;margin-bottom:14px\">STAY CONNECTED<\u002Fdiv>\n    <h2 style=\"font-family:'Special Elite',monospace;font-size:clamp(24px,3.4vw,34px);margin:0 0 22px;color:#1A1614\">FOLLOW ON X<\u002Fh2>\n    <a href=\"{{ xProfileUrl }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ click }}\" style=\"display:inline-block;font-family:'Special Elite',monospace;font-size:16px;letter-spacing:.1em;color:#F2E7D2;background:#6E2230;padding:16px 34px;box-shadow:0 5px 0 #4c1521\" style-hover=\"background:#82283a\">{{ xHandle }}<\u002Fa>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"padding:44px 20px 50px;background:#1A1614;color:#F2E7D2;text-align:center\">\n    <div style=\"font-family:'Special Elite',monospace;font-size:18px;margin-bottom:10px\">ROYAL MECHANICA<\u002Fdiv>\n    <div style=\"font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.1em;color:#a89a80;display:flex;gap:16px;justify-content:center;flex-wrap:wrap\">\n      <span>6,666 NFTs<\u002Fspan><span>·<\u002Fspan><a href=\"{{ xProfileUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"color:#a89a80\" style-hover=\"color:#F2E7D2\">{{ xHandle }}<\u002Fa><span>·<\u002Fspan><span>{{ domain }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst ROWS = [\n  \"1234567890-\",\n  \"QWERTYUIOP\",\n  \"ASDFGHJKL;\",\n  \"ZXCVBNM,./\"\n];\n\nclass Component extends DCLogic {\n  state = { screen: \"intro\", introTyped: \"\", activeKey: null, sound: true, menuOpen: false };\n\n  get cfg() {\n    return (typeof window !== \"undefined\" && window.RM_CONFIG) || { collection: {}, endpoints: {}, gallery: [], roadmap: [], tickers: [] };\n  }\n\n  componentDidMount() {\n    this._unlock = () => this.unlockAudio();\n    window.addEventListener(\"pointerdown\", this._unlock, { once: true });\n    window.addEventListener(\"keydown\", this._unlock, { once: true });\n    this._timers = [];\n    setTimeout(() => this.runIntro(), 950);\n  }\n\n  componentWillUnmount() {\n    (this._timers || []).forEach(clearTimeout);\n    window.removeEventListener(\"pointerdown\", this._unlock);\n    window.removeEventListener(\"keydown\", this._unlock);\n  }\n\n  unlockAudio() {\n    try {\n      if (!this._ac) {\n        const AC = window.AudioContext || window.webkitAudioContext;\n        if (AC) this._ac = new AC();\n      }\n      if (this._ac && this._ac.state === \"suspended\") this._ac.resume();\n    } catch (e) { this._ac = null; }\n  }\n\n  strike(kind) {\n    if (!this.state.sound) return;\n    this.unlockAudio();\n    const ac = this._ac;\n    if (!ac || ac.state !== \"running\") return;\n    const t = ac.currentTime;\n    const dur = kind === \"soft\" ? 0.045 : 0.075;\n    const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);\n    const d = buf.getChannelData(0);\n    for (let i = 0; i < d.length; i++) {\n      const p = i / d.length;\n      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - p, kind === \"soft\" ? 5 : 3);\n    }\n    const src = ac.createBufferSource(); src.buffer = buf;\n    const bp = ac.createBiquadFilter();\n    bp.type = \"bandpass\";\n    bp.frequency.value = kind === \"soft\" ? 1400 : 2100 + Math.random() * 700;\n    bp.Q.value = 1.1;\n    const g = ac.createGain();\n    g.gain.setValueAtTime(kind === \"soft\" ? 0.10 : 0.20, t);\n    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);\n    src.connect(bp); bp.connect(g); g.connect(ac.destination);\n    src.start(t);\n    if (kind !== \"soft\") {\n      const o = ac.createOscillator(), og = ac.createGain();\n      o.type = \"square\"; o.frequency.setValueAtTime(180 + Math.random() * 40, t);\n      og.gain.setValueAtTime(0.05, t);\n      og.gain.exponentialRampToValueAtTime(0.0006, t + 0.05);\n      o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t + 0.06);\n    }\n  }\n\n  click() { this.strike(\"hard\"); }\n\n  toggleSound = () => { this.strike(\"soft\"); this.setState(s => ({ sound: !s.sound })); };\n  toggleMenu = () => { this.strike(\"soft\"); this.setState(s => ({ menuOpen: !s.menuOpen })); };\n\n  runIntro() {\n    const text = \"ROYAL MECHANICA\";\n    let i = 0;\n    const step = () => {\n      if (this.state.screen !== \"intro\") return;\n      const ch = text[i];\n      this.strike(ch === \" \" ? \"soft\" : \"hard\");\n      this.setState(s => ({ introTyped: s.introTyped + ch, activeKey: ch === \" \" ? \"SPACE\" : ch }));\n      const t1 = setTimeout(() => this.setState({ activeKey: null }), 90);\n      this._timers.push(t1);\n      i++;\n      if (i < text.length) {\n        const base = ch === \" \" ? 300 : 370;\n        const t2 = setTimeout(step, base + Math.random() * 110);\n        this._timers.push(t2);\n      } else {\n        const t3 = setTimeout(() => this.enterSite(), 1400);\n        this._timers.push(t3);\n      }\n    };\n    const t0 = setTimeout(step, 250);\n    this._timers.push(t0);\n  }\n\n  enterSite = () => {\n    (this._timers || []).forEach(clearTimeout);\n    this._timers = [];\n    this.setState({ screen: \"home\", activeKey: null });\n  };\n\n  skipIntro = () => { this.click(); this.enterSite(); };\n\n  keyRows(active) {\n    return ROWS.map(row => ({\n      keys: row.split(\"\").map(label => {\n        const on = active === label;\n        return { label, dy: on ? 3 : 0, sh: on ? 0 : 3 };\n      })\n    }));\n  }\n\n  renderVals() {\n    const cfg = this.cfg;\n    return {\n      isIntro: this.state.screen === \"intro\",\n      isHome: this.state.screen === \"home\",\n      introTyped: this.state.introTyped,\n      introRows: this.keyRows(this.state.activeKey),\n      soundLabel: this.state.sound ? \"SOUND ON\" : \"SOUND OFF\",\n      skipIntro: this.skipIntro,\n      toggleSound: this.toggleSound,\n      menuOpen: this.state.menuOpen,\n      toggleMenu: this.toggleMenu,\n      click: this.click.bind(this),\n      xProfileUrl: cfg.collection.xProfileUrl,\n      xHandle: cfg.collection.xHandle,\n      domain: cfg.collection.domain,\n      galleryItems: (cfg.gallery || []).filter(g => !!g.image).map(g => ({\n        ...g,\n        imageCss: 'url(\"' + String(g.image).replace(/\"/g, \"%22\") + '\")'\n      })),\n      roadmapItems: cfg.roadmap || [],\n      tickerChips: (cfg.tickers || []).map(label => ({ label }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
